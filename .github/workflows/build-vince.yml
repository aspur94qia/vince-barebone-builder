name: Build Vince Headless

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-headless-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli android-sdk-libsparse-utils e2fsprogs p7zip-full python3 zip aria2 wget curl

      - name: Execute ROM Builder Script
        run: ./scripts/build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-mini-headless
          path: output/vince-mini-headless.zip
