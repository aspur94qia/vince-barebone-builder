name: Build Vince Headless Modular

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-headless-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Build Dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y brotli android-sdk-libsparse-utils e2fsprogs p7zip-full python3 zip aria2 wget curl

      - name: 2. Download Native ARM64 Tools
        run: |
          set -x
          mkdir -p /tmp/native_tools
          cd /tmp/native_tools
          wget -q -O busybox https://github.com/muntashirakon/busybox-NDK/releases/download/v1.36.1/busybox-arm64-v8a || true
          wget -q -O hostapd https://raw.githubusercontent.com/nethunteros/android_external_hostapd/master/hostapd || true
          wget -q -O dnsmasq https://raw.githubusercontent.com/eugr/dnsmasq-android/master/binary/arm64-v8a/dnsmasq || true
          wget -q -O dropbear https://raw.githubusercontent.com/mchome/dropbear-android/master/bin/arm64-v8a/dropbear || true
          wget -q -O iw https://raw.githubusercontent.com/nethunteros/android_external_iw/master/iw || true
          wget -q -O tcpdump https://raw.githubusercontent.com/nethunteros/android_external_tcpdump/master/tcpdump || true
          wget -q -O iftop https://raw.githubusercontent.com/nethunteros/android_external_iftop/master/iftop || true
          chmod +x *
          ls -lh /tmp/native_tools

      - name: 3. Download LineageOS ROM
        run: |
          set -x
          mkdir -p work output
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/rom.zip "$ROM_URL"
          unzip work/rom.zip -d work/extracted/
          ls -lh work/extracted/

      - name: 4. Unpack System Image
        run: |
          set -x
          cd work/extracted
          ls -lh
          brotli -d system.new.dat.br -o system.new.dat
          wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py system.transfer.list system.new.dat system.img
          mkdir -p sys_mnt
          sudo mount -o loop system.img sys_mnt/
          df -h

      - name: 5. Inject Tools and Configs Safely
        run: |
          set -x
          ./scripts/inject.sh

      - name: 6. Repack and Compress ROM (Core Minimalist)
        run: |
          set -x
          cd work/extracted
          sudo umount sys_mnt/ || true
          
          # Cek ukuran dan buat sparse image system
          img2simg system.img system_sparse.img
          rm -f system.new.dat.br system.transfer.list system.new.dat
          
          # Salin modul img2sdat lokal
          cp ../../utils/*.py .
          python3 img2sdat.py system_sparse.img -o . -v 4
          
          brotli -q 6 system.new.dat -o system.new.dat.br
          
          # Repack vendor jika ada vendor.img hasil trim
          if [ -f "vendor.img" ]; then
            img2simg vendor.img vendor_sparse.img
            python3 img2sdat.py vendor_sparse.img -o . -v 4
            brotli -q 6 vendor.new.dat -o vendor.new.dat.br
            rm -f vendor.img vendor_sparse.img vendor.new.dat
          fi
          
          rm -rf system.img system_sparse.img system.new.dat sys_mnt sdat2img.py common.py blockimgdiff.py sparse_img.py rangelib.py
          
          # Buat ZIP final
          cd ../..
          mkdir -p output
          cd work/extracted
          zip -9 -r "../../output/vince-mini-headless.zip" boot.img META-INF/ $(ls *.dat.br *.transfer.list 2>/dev/null)
          ls -lh ../../output/vince-mini-headless.zip

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-mini-headless
          path: output/vince-mini-headless.zip
