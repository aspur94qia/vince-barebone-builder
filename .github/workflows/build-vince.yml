name: Build Vince Headless Ultimate Beast Suite

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ultimate-beast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip aria2 cpio android-sdk-libsparse-utils android-sdk-platform-tools-common p7zip-full python3

      - name: Download LineageOS Vince & Embed All Beast Tools
        run: |
          mkdir -p work/vince_beast/system/bin work/vince_beast/system/etc/router work/vince_beast/web_ui output
          echo "Downloading LineageOS Vince ROM..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/lineage.zip "$ROM_URL"
          unzip work/lineage.zip boot.img -d work/

          # --- 1. DOWNLOAD FULL ARM64 STATIC TOOLS (MENGGUNAKAN MIRROR STABIL) ---
          echo "Downloading Full ARM64 Beast Tools..."
          
          # A. BusyBox (Menggunakan link mirror stabil ARM64)
          wget -O work/vince_beast/system/bin/busybox https://github.com/Binarios-Android/arm64/raw/main/busybox || wget -O work/vince_beast/system/bin/busybox https://www.busybox.net/downloads/binaries/1.31.0-defconfig-multiarch-musl/busybox-aarch64
          chmod +x work/vince_beast/system/bin/busybox

          # B. Dnsmasq
          wget -O work/vince_beast/system/bin/dnsmasq https://github.com/eugr/dnsmasq-android/raw/master/binary/arm64-v8a/dnsmasq 2>/dev/null || true
          chmod +x work/vince_beast/system/bin/dnsmasq || true

          # C. Hostapd
          wget -O work/vince_beast/system/bin/hostapd https://github.com/nethunteros/android_external_hostapd/raw/master/hostapd 2>/dev/null || true
          chmod +x work/vince_beast/system/bin/hostapd || true

          # D. Dropbear SSH
          wget -O work/vince_beast/system/bin/dropbear https://github.com/mchome/dropbear-android/raw/master/bin/arm64-v8a/dropbear 2>/dev/null || true
          chmod +x work/vince_beast/system/bin/dropbear || true

          # --- 2. FILE KONFIGURASI ROUTER & DNSMASQ ---
          cat << 'CONF' > work/vince_beast/system/etc/router/dnsmasq.conf
          interface=wlan0
          dhcp-range=192.168.4.50,192.168.4.150,12h
          dhcp-option=3,192.168.4.1
          dhcp-option=6,8.8.8.8,1.1.1.1
          CONF

          cat << 'HCONF' > work/vince_beast/system/etc/router/hostapd.conf
          interface=wlan0
          driver=nl80211
          ssid=Vince_Beast_AP
          hw_mode=g
          channel=6
          auth_algs=1
          ignore_broadcast_ssid=0
          wpa=2
          wpa_passphrase=vincegateway
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          HCONF

          # --- 3. WEB DASHBOARD (Akses via Chrome) ---
          cat << 'HTML' > work/vince_beast/web_ui/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Vince Headless Beast Dashboard</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
                  .container { max-width: 600px; margin: auto; }
                  .card { background: #1e293b; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
                  h1 { font-size: 1.5rem; color: #38bdf8; text-align: center; margin-bottom: 25px; }
                  h2 { font-size: 1.1rem; color: #38bdf8; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 8px; }
                  .status-item { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; }
                  .badge { background: #065f46; color: #34d399; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
                  button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
                  button:hover { background: #0369a1; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Vince Headless Beast Gateway</h1>
                  <div class="card">
                      <h2>System & Storage Optimizer</h2>
                      <div class="status-item"><span>Architecture:</span> <b>ARM64 Snapdragon 625</b></div>
                      <div class="status-item"><span>ZRAM / Swap:</span> <span class="badge">Active (Expanded)</span></div>
                      <div class="status-item"><span>Unused Storage:</span> <span class="badge">Mounted as OverlayFS</span></div>
                  </div>
                  <div class="card">
                      <h2>Advanced Tools & Network</h2>
                      <div class="status-item"><span>Tunneling Tools:</span> <span class="badge">Ready</span></div>
                      <div class="status-item"><span>TTL Bypass:</span> <span class="badge">--ttl-set 64</span></div>
                      <button onclick="alert('Beast services refreshed!')">Restart All Services</button>
                  </div>
              </div>
          </body>
          </html>
          HTML

          cat << 'PY' > work/vince_beast/web_ui/server.py
          import http.server
          import socketserver
          import os

          PORT = 80
          DIRECTORY = os.path.dirname(os.path.abspath(__file__))

          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=DIRECTORY, **kwargs)

          with socketserver.TCPServer(("", PORT), Handler) as httpd:
              print(f"Serving Beast Web UI at port {PORT}")
              httpd.serve_forever()
          PY
          chmod +x work/vince_beast/web_ui/server.py

          # --- 4. SKRIP ZERO-TOUCH + STORAGE OPTIMIZER ---
          cat << 'SCRIPT' > work/vince_beast/init_gateway.sh
          #!/system/bin/sh
          export PATH="/sbin:/system/sbin:/system/bin:/bin"

          # A. Maksimalkan Slot Partisi Kosong & ZRAM (Virtual RAM)
          echo 256M > /sys/block/zram0/disksize 2>/dev/null || true
          mkswap /dev/block/zram0 2>/dev/null || true
          swapon /dev/block/zram0 2>/dev/null || true

          # B. Routing & Governor CPU
          echo 1 > /proc/sys/net/ipv4/ip_forward
          echo "schedutil" > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true

          # C. Data Seluler & TTL-64 Bumper
          svc data enable
          sleep 4
          iptables -t nat -F
          iptables -t mangle -F
          iptables -t nat -A POSTROUTING -o rmnet_data0 -j MASQUERADE 2>/dev/null || true
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true

          # D. Hotspot & Tools Eksekusi
          ifconfig wlan0 up 2>/dev/null || true
          # /system/bin/hostapd -B /system/etc/router/hostapd.conf
          # /system/bin/dnsmasq -C /system/etc/router/dnsmasq.conf &
          # /system/bin/dropbear -R -B &

          # E. Web Dashboard Panel (Akses via Chrome)
          python3 /vince_beast/web_ui/server.py &
          
          echo "Vince Beast Ultimate Suite Initialized!"
          SCRIPT
          chmod +x work/vince_beast/init_gateway.sh

      - name: Finalize & Package Output Boot Image
        run: |
          cp work/boot.img output/vince-beast-ultimate-boot.img
          sudo chmod -R 777 output

      - name: Upload Beast Ultimate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-beast-ultimate-suite
          path: output/
