name: Build Vince Ultra-Lite ROM + Tools Suite

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-headless-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Unpack Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli android-sdk-libsparse-utils p7zip-full python3-pip zip aria2 wget curl
          pip3 install backports.lzma protobuf

          # Download ARM64 Static Busybox
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          mkdir -p /tmp/busybox_pkg
          cd /tmp/busybox_pkg
          apt-get download busybox-static:arm64
          dpkg-deb -x busybox-static*.deb .

      - name: Download, Unpack, Strip & Inject Tools
        run: |
          mkdir -p work output
          echo "Downloading LineageOS..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/rom.zip "$ROM_URL"
          
          unzip work/rom.zip -d work/extracted/
          cd work/extracted

          # Decompress brotli system.new.dat.br
          if [ -f system.new.dat.br ]; then
            brotli -d system.new.dat.br -o system.new.dat
            python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py', 'sdat2img.py')"
            python3 sdat2img.py system.transfer.list system.new.dat system.img
            mkdir sys_mnt
            sudo mount -o loop system.img sys_mnt/
            
            # --- 1. BABAT HABIS SYSTEM (GUI & MEDIA) ---
            sudo rm -rf sys_mnt/system/priv-app/SystemUI
            sudo rm -rf sys_mnt/system/priv-app/Trebuchet
            sudo rm -rf sys_mnt/system/app/*
            sudo rm -rf sys_mnt/system/media/audio/*
            sudo rm -rf sys_mnt/system/fonts/*
            
            # --- 2. EMBED ROUTER TOOLS & UTILITIES ---
            sudo mkdir -p sys_mnt/system/bin sys_mnt/system/etc/router sys_mnt/system/web_ui sys_mnt/system/etc/init

            BUSYBOX_BIN=$(find /tmp/busybox_pkg -name "busybox" -type f | head -n 1)
            sudo cp "$BUSYBOX_BIN" sys_mnt/system/bin/busybox
            sudo chmod +x sys_mnt/system/bin/busybox

            sudo wget -O sys_mnt/system/bin/dnsmasq https://github.com/eugr/dnsmasq-android/raw/master/binary/arm64-v8a/dnsmasq || true
            sudo chmod +x sys_mnt/system/bin/dnsmasq || true

            sudo wget -O sys_mnt/system/bin/hostapd https://github.com/nethunteros/android_external_hostapd/raw/master/hostapd || true
            sudo chmod +x sys_mnt/system/bin/hostapd || true

            sudo wget -O sys_mnt/system/bin/dropbear https://github.com/mchome/dropbear-android/raw/master/bin/arm64-v8a/dropbear || true
            sudo chmod +x sys_mnt/system/bin/dropbear || true

            # Config Router
            sudo bash -c 'cat << "CONF" > sys_mnt/system/etc/router/dnsmasq.conf
interface=wlan0
dhcp-range=192.168.4.50,192.168.4.150,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,8.8.8.8,1.1.1.1
CONF'

            # Web Dashboard
            sudo bash -c 'cat << "HTML" > sys_mnt/system/web_ui/index.html
<!DOCTYPE html>
<html>
<head>
    <title>Vince Headless Beast</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Vince Headless Gateway Active</h2>
        <p>SSID: Vince_Beast_AP</p>
        <p>Bluetooth Audio Sink: Active</p>
        <p>TTL Bypass: 64</p>
    </div>
</body>
</html>
HTML'

            sudo bash -c 'cat << "PY" > sys_mnt/system/web_ui/server.py
import http.server
import socketserver
import os

PORT = 80
DIRECTORY = os.path.dirname(os.path.abspath(__file__))

class Handler(http.server.SimpleHTTPRequestHandler):
    def __init__(self, *args, **kwargs):
        super().__init__(*args, directory=DIRECTORY, **kwargs)

with socketserver.TCPServer(("", PORT), Handler) as httpd:
    httpd.serve_forever()
PY'

            # --- 3. INJECT AUTO-START SCRIPT & SERVICE ---
            sudo bash -c 'cat << "SCRIPT" > sys_mnt/system/bin/vince_init.sh
#!/system/bin/sh
sleep 8
setenforce 0 2>/dev/null || true

# Performance & Forwarding
echo 256M > /sys/block/zram0/disksize 2>/dev/null || true
mkswap /dev/block/zram0 2>/dev/null || true
swapon /dev/block/zram0 2>/dev/null || true
echo 1 > /proc/sys/net/ipv4/ip_forward

# Cellular Data & Firewall TTL-64
svc data enable
sleep 2
iptables -t nat -F 2>/dev/null || true
iptables -t mangle -F 2>/dev/null || true
iptables -t nat -A POSTROUTING -o rmnet_data0 -j MASQUERADE 2>/dev/null || true
iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true

# Direct Hotspot
svc wifi enable 2>/dev/null || true
cmd wifi start-softap Vince_Beast_AP open 2>/dev/null || ifconfig wlan0 up 2>/dev/null || true

# Direct Bluetooth Receiver
svc bluetooth enable 2>/dev/null || true
sleep 2
bluetoothctl power on 2>/dev/null || true
bluetoothctl discoverable on 2>/dev/null || true
bluetoothctl pairable on 2>/dev/null || true

# Web Dashboard
python3 /system/web_ui/server.py &
SCRIPT'
            sudo chmod 755 sys_mnt/system/bin/vince_init.sh

            sudo bash -c 'cat << "INITRC" > sys_mnt/system/etc/init/vince_gateway.rc
on property:sys.boot_completed=1
    exec u:r:init:s0 root root -- /system/bin/vince_init.sh
INITRC'
            sudo chmod 644 sys_mnt/system/etc/init/vince_gateway.rc

            # Repack Image & Compress
            sudo img2simg sys_mnt/system.img system_stripped.img
            sudo umount sys_mnt/
          fi

          # Timpa system lama dan buat zip installer kerdil
          zip -9 -r ../../output/vince-mini-headless.zip boot.img vendor.new.dat.br vendor.transfer.list system_stripped.img META-INF/

      - name: Upload Small Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-mini-headless
          path: output/
