name: Build Vince Slim Headless Router (<200MB)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-slim-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Setup Build Environment & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli android-sdk-libsparse-utils e2fsprogs p7zip-full python3 zip aria2 curl

      - name: 2. Download Base ROM & Extract
        run: |
          mkdir -p work/output work/extracted
          cd work
          
          echo ">>> [1/5] Mendownload LineageOS Vince..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o rom.zip "$ROM_URL"
          unzip rom.zip boot.img system.new.dat.br system.transfer.list vendor.new.dat.br vendor.transfer.list -d extracted/
          
          cd extracted
          echo ">>> [2/5] Membongkar Image Mentah..."
          brotli -d system.new.dat.br -o system.new.dat
          brotli -d vendor.new.dat.br -o vendor.new.dat
          curl -sL -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py system.transfer.list system.new.dat system.img
          python3 sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          
          mkdir -p sys_mnt vnd_mnt
          sudo mount -o loop system.img sys_mnt/
          sudo mount -o loop vendor.img vnd_mnt/
          
          echo ">>> [3/5] Inject Fitur WebUI & Anti-Hotspot..."
          sudo mkdir -p sys_mnt/system/bin sys_mnt/system/www sys_mnt/system/etc
          docker pull --platform linux/arm64 busybox:musl
          docker create --name extract_bb busybox:musl
          docker cp extract_bb:/bin/busybox ./busybox-arm64
          docker rm extract_bb
          sudo cp busybox-arm64 sys_mnt/system/bin/busybox
          sudo chmod 755 sys_mnt/system/bin/busybox
          sudo ln -sf /system/bin/busybox sys_mnt/system/bin/sh
          
          sudo tee sys_mnt/system/www/index.html << 'HTML_EOF' > /dev/null
          <!DOCTYPE html><html><head><title>Vince Router</title></head>
          <body><h2>Router Aktif!</h2></body></html>
          HTML_EOF
          
          sudo tee sys_mnt/system/etc/router_init.sh << 'SH_EOF' > /dev/null
          #!/system/bin/sh
          echo 1 > /proc/sys/net/ipv4/ip_forward
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64
          cd /system/www && busybox httpd -p 80 &
          SH_EOF
          sudo chmod 755 sys_mnt/system/etc/router_init.sh
          
          echo ">>> [4/5] DIET EKSTREM TAHAP 2 (Membantai Raksasa Android) <<<"
          
          # Hapus partisi tambahan raksasa (UI ekstra & bloatware)
          sudo rm -rf sys_mnt/system/system_ext sys_mnt/system_ext
          sudo rm -rf sys_mnt/system/product sys_mnt/product
          
          # Hapus Aplikasi, Font, Media, Mesin Java
          sudo rm -rf sys_mnt/system/app sys_mnt/system/priv-app sys_mnt/system/framework
          sudo rm -rf sys_mnt/system/media sys_mnt/system/fonts sys_mnt/system/tts sys_mnt/system/usr/icu
          
          # Hapus Modul APEX raksasa (Hanya sisakan runtime dasar)
          sudo rm -rf sys_mnt/system/apex/com.android.art* sys_mnt/system/apex/com.android.vndk*
          sudo rm -rf sys_mnt/system/apex/com.android.media*
          
          # Hapus Library Berat (Grafis 3D Vulkan, OpenGL, Webview, Chrome)
          sudo rm -f sys_mnt/system/lib/libart* sys_mnt/system/lib64/libart*
          sudo rm -f sys_mnt/system/lib/libvulkan* sys_mnt/system/lib64/libvulkan*
          sudo rm -f sys_mnt/system/lib/libwebview* sys_mnt/system/lib64/libwebview*
          sudo rm -f sys_mnt/system/lib/libchrome* sys_mnt/system/lib64/libchrome*
          sudo rm -rf sys_mnt/system/lib/hw/vulkan* sys_mnt/system/lib64/hw/vulkan*
          
          # Hapus Vendor (Driver Kamera, GPU, Overlay Layar - Sisakan Modem & WiFi)
          sudo rm -rf vnd_mnt/app vnd_mnt/priv-app vnd_mnt/media vnd_mnt/soundfx vnd_mnt/camera vnd_mnt/overlay
          sudo rm -rf vnd_mnt/lib/egl vnd_mnt/lib64/egl vnd_mnt/lib/hw/vulkan* vnd_mnt/lib64/hw/vulkan*
          sudo rm -rf vnd_mnt/lib/hw/camera* vnd_mnt/lib64/hw/camera*
          
          # Hapus Firmware yang tidak dipakai router (Video encoder, Audio, Sensor NPU)
          sudo rm -rf vnd_mnt/firmware/venus* vnd_mnt/firmware/adsp* vnd_mnt/firmware/cdsp* vnd_mnt/firmware/slpi*
          
          # Cegah Bootloop
          sudo rm -f sys_mnt/system/bin/app_process* sys_mnt/system/bin/surfaceflinger sys_mnt/system/bin/bootanimation
          sudo rm -f sys_mnt/system/etc/init/zygote*.rc sys_mnt/system/etc/init/surfaceflinger.rc
          
          echo ">>> [5/5] Zero-Fill untuk kompresi ZIP Maksimal..."
          sudo dd if=/dev/zero of=sys_mnt/zeroes bs=1M 2>/dev/null || true
          sudo rm -f sys_mnt/zeroes
          sudo dd if=/dev/zero of=vnd_mnt/zeroes bs=1M 2>/dev/null || true
          sudo rm -f vnd_mnt/zeroes
          
          sudo umount sys_mnt/
          sudo umount vnd_mnt/
          
          e2fsck -fy system.img || true
          resize2fs -M system.img
          e2fsck -fy vendor.img || true
          resize2fs -M vendor.img

      - name: 3. Pack to Flashable ZIP (<200MB)
        run: |
          cd work/extracted
          mkdir -p META-INF/com/google/android
          cat << 'EOF' > META-INF/com/google/android/updater-script
          ui_print("========================================");
          ui_print("  Vince Slim Headless Router (<200MB)   ");
          ui_print("========================================");
          mount("ext4", "EMMC", "/dev/block/bootdevice/by-name/system", "/system");
          package_extract_file("system.img", "/dev/block/bootdevice/by-name/system");
          unmount("/system");
          mount("ext4", "EMMC", "/dev/block/bootdevice/by-name/vendor", "/vendor");
          package_extract_file("vendor.img", "/dev/block/bootdevice/by-name/vendor");
          unmount("/vendor");
          package_extract_file("boot.img", "/dev/block/bootdevice/by-name/boot");
          ui_print("Selesai!");
          EOF
          cd ..
          zip -9 -r "output/vince-slim-router.zip" extracted/boot.img extracted/system.img extracted/vendor.img extracted/META-INF

      - name: 4. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-slim-router
          path: work/output/vince-slim-router.zip
