name: Build Vince Ultra-Lite Headless ROM Suite

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-headless-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip aria2 cpio android-sdk-libsparse-utils android-sdk-platform-tools-common p7zip-full python3 zip
          
          # Fetch ARM64 Static Busybox
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          mkdir -p /tmp/busybox_pkg
          cd /tmp/busybox_pkg
          apt-get download busybox-static:arm64
          dpkg-deb -x busybox-static*.deb .

      - name: Download & Ultra-Strip LineageOS Vince ROM
        run: |
          mkdir -p work output
          echo "Downloading LineageOS Vince ROM..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/lineage_raw.zip "$ROM_URL"
          
          echo "Unpacking ROM..."
          unzip work/lineage_raw.zip -d work/rom/

          # --- 1. EXTREME STRIP-DOWN (GUI, AUDIO, FONTS, APPS) ---
          echo "Babat Habis Bloatware, UI, Media & Fonts..."
          cd work/rom
          rm -rf system/priv-app/SystemUI system/priv-app/Trebuchet system/priv-app/NexusLauncher* 2>/dev/null || true
          rm -rf system/app/Camera2 system/app/Gallery2 system/app/Calendar system/app/DeskClock 2>/dev/null || true
          rm -rf system/app/FM system/app/Music system/app/ExactCalculator system/app/* 2>/dev/null || true
          rm -rf system/media/audio/* system/fonts/* 2>/dev/null || true

          # --- 2. EMBED ROUTER TOOLS & UTILITIES ---
          echo "Embedding ARM64 Router Tools & Binaries..."
          mkdir -p system/bin system/etc/router system/web_ui system/etc/init

          BUSYBOX_BIN=$(find /tmp/busybox_pkg -name "busybox" -type f | head -n 1)
          cp "$BUSYBOX_BIN" system/bin/busybox
          chmod +x system/bin/busybox

          wget -O system/bin/dnsmasq https://github.com/eugr/dnsmasq-android/raw/master/binary/arm64-v8a/dnsmasq || true
          chmod +x system/bin/dnsmasq || true

          wget -O system/bin/hostapd https://github.com/nethunteros/android_external_hostapd/raw/master/hostapd || true
          chmod +x system/bin/hostapd || true

          wget -O system/bin/dropbear https://github.com/mchome/dropbear-android/raw/master/bin/arm64-v8a/dropbear || true
          chmod +x system/bin/dropbear || true

          # --- 3. CONFIG FILES ---
          cat << 'CONF' > system/etc/router/dnsmasq.conf
          interface=wlan0
          dhcp-range=192.168.4.50,192.168.4.150,12h
          dhcp-option=3,192.168.4.1
          dhcp-option=6,8.8.8.8,1.1.1.1
          CONF

          cat << 'HCONF' > system/etc/router/hostapd.conf
          interface=wlan0
          driver=nl80211
          ssid=Vince_Beast_AP
          hw_mode=g
          channel=6
          auth_algs=1
          ignore_broadcast_ssid=0
          wpa=2
          wpa_passphrase=vincegateway
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          HCONF

          # --- 4. WEB DASHBOARD SERVER ---
          cat << 'HTML' > system/web_ui/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Vince Headless Beast Dashboard</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                  body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
                  .container { max-width: 600px; margin: auto; }
                  .card { background: #1e293b; padding: 20px; margin-bottom: 15px; border-radius: 12px; }
                  h1 { color: #38bdf8; text-align: center; }
                  h2 { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
                  .status { display: flex; justify-content: space-between; margin: 10px 0; }
                  .badge { background: #065f46; color: #34d399; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Vince Headless Gateway</h1>
                  <div class="card">
                      <h2>System Status</h2>
                      <div class="status"><span>Device:</span> <b>Redmi 5 Plus (vince)</b></div>
                      <div class="status"><span>Mode:</span> <b>Ultra-Lite Headless ROM</b></div>
                      <div class="status"><span>Hotspot SSID:</span> <b>Vince_Beast_AP</b></div>
                      <div class="status"><span>Bluetooth Audio Sink:</span> <span class="badge">Active</span></div>
                      <div class="status"><span>TTL Bypass:</span> <span class="badge">--ttl-set 64</span></div>
                  </div>
              </div>
          </body>
          </html>
          HTML

          cat << 'PY' > system/web_ui/server.py
          import http.server
          import socketserver
          import os

          PORT = 80
          DIRECTORY = os.path.dirname(os.path.abspath(__file__))

          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=DIRECTORY, **kwargs)

          with socketserver.TCPServer(("", PORT), Handler) as httpd:
              httpd.serve_forever()
          PY

          # --- 5. AUTO-START SCRIPT & SERVICE ---
          cat << 'SCRIPT' > system/bin/vince_init.sh
          #!/system/bin/sh
          sleep 8
          setenforce 0 2>/dev/null || true

          # Performance & Forwarding
          echo 256M > /sys/block/zram0/disksize 2>/dev/null || true
          mkswap /dev/block/zram0 2>/dev/null || true
          swapon /dev/block/zram0 2>/dev/null || true
          echo 1 > /proc/sys/net/ipv4/ip_forward

          # Cellular Data & Firewall TTL-64
          svc data enable
          sleep 2
          iptables -t nat -F 2>/dev/null || true
          iptables -t mangle -F 2>/dev/null || true
          iptables -t nat -A POSTROUTING -o rmnet_data0 -j MASQUERADE 2>/dev/null || true
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true

          # Direct Hotspot
          svc wifi enable 2>/dev/null || true
          cmd wifi start-softap Vince_Beast_AP open 2>/dev/null || ifconfig wlan0 up 2>/dev/null || true

          # Direct Bluetooth Receiver
          svc bluetooth enable 2>/dev/null || true
          sleep 2
          bluetoothctl power on 2>/dev/null || true
          bluetoothctl discoverable on 2>/dev/null || true
          bluetoothctl pairable on 2>/dev/null || true

          # Web Server
          python3 /system/web_ui/server.py &
          SCRIPT
          chmod 755 system/bin/vince_init.sh

          cat << 'INITRC' > system/etc/init/vince_gateway.rc
          on property:sys.boot_completed=1
              exec u:r:init:s0 root root -- /system/bin/vince_init.sh
          INITRC
          chmod 644 system/etc/init/vince_gateway.rc

          # --- 6. PACKAGING WITH MAXIMUM COMPRESSION ---
          echo "Packaging Ultra-Lite Headless ZIP..."
          zip -9 -r ../../output/vince-ultralite-beast-installer.zip .
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-ultralite-beast-installer
          path: output/
