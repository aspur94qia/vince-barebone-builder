name: Build Vince Headless Stable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-headless-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli android-sdk-libsparse-utils e2fsprogs p7zip-full python3 zip aria2 wget curl

      - name: Download, Unpack, Strip & Repack
        run: |
          mkdir -p work output
          echo "Downloading LineageOS..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/rom.zip "$ROM_URL"
          
          unzip work/rom.zip -d work/extracted/
          cd work/extracted

          # 1. Unpack Brotli system.new.dat.br
          brotli -d system.new.dat.br -o system.new.dat
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py', 'sdat2img.py')"
          python3 sdat2img.py system.transfer.list system.new.dat system.img
          
          mkdir sys_mnt
          sudo mount -o loop system.img sys_mnt/
          
          # 2. BABAT GUI & BLOATWARE VISUAL
          sudo rm -rf sys_mnt/system/priv-app/SystemUI 2>/dev/null || true
          sudo rm -rf sys_mnt/system/priv-app/Trebuchet 2>/dev/null || true
          sudo rm -rf sys_mnt/system/app/* 2>/dev/null || true
          sudo rm -rf sys_mnt/system/media/audio/* 2>/dev/null || true
          sudo rm -rf sys_mnt/system/fonts/* 2>/dev/null || true
          
          # 3. EMBED TOOLS & AUTOSTART SCRIPT
          sudo mkdir -p sys_mnt/system/bin sys_mnt/system/etc/router sys_mnt/system/web_ui sys_mnt/system/etc/init

          sudo wget -O sys_mnt/system/bin/busybox https://bin.equinox.io/c/bNy82THRRaY/busybox-static-arm64.zip || true
          sudo wget -O sys_mnt/system/bin/dnsmasq https://github.com/eugr/dnsmasq-android/raw/master/binary/arm64-v8a/dnsmasq || true
          sudo wget -O sys_mnt/system/bin/hostapd https://github.com/nethunteros/android_external_hostapd/raw/master/hostapd || true
          sudo chmod +x sys_mnt/system/bin/* || true

          sudo bash -c 'cat << "SCRIPT" > sys_mnt/system/bin/vince_init.sh
#!/system/bin/sh
sleep 8
setenforce 0 2>/dev/null || true
echo 1 > /proc/sys/net/ipv4/ip_forward
iptables -t nat -A POSTROUTING -o rmnet_data0 -j MASQUERADE 2>/dev/null || true
iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true
svc wifi enable
cmd wifi start-softap Vince_Beast_AP open
svc bluetooth enable
SCRIPT'
          sudo chmod 755 sys_mnt/system/bin/vince_init.sh

          sudo bash -c 'cat << "INITRC" > sys_mnt/system/etc/init/vince_gateway.rc
on property:sys.boot_completed=1
    exec u:r:init:s0 root root -- /system/bin/vince_init.sh
INITRC'
          sudo chmod 644 sys_mnt/system/etc/init/vince_gateway.rc

          # 4. REPACK ULANG RAW EXT4 IMAGE & COMPRESS
          sudo umount sys_mnt/
          img2simg system.img system_sparse.img
          
          # 5. KEMBALIKAN KE FORMAT SYSTEM.NEW.DAT.BR ORIGINAL
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/xpirt/img2sdat/master/img2sdat.py', 'img2sdat.py')"
          python3 img2sdat.py system_sparse.img -o . -v 4
          brotli -q 11 system.new.dat -o system.new.dat.br

          # Clean up & Paketkan ZIP
          rm -rf system.img system_sparse.img system.new.dat sys_mnt sdat2img.py img2sdat.py
          zip -9 -r ../../output/vince-mini-headless.zip boot.img vendor.new.dat.br vendor.transfer.list system.new.dat.br system.transfer.list META-INF/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vince-mini-headless
          path: output/
