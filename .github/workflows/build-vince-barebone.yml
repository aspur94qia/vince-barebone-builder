name: Vince Android Barebone + Linux Chroot Tools

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-barebone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip android-sdk-libsparse-utils android-sdk-platform-tools-common abootimg mkbootimg cpio gzip

      - name: Build Headless Ramdisk & Init Scripts
        run: |
          mkdir -p ramdisk/sbin output/chroot_bundle
          
          # 1. Buat skrip init minimal untuk ramdisk
          cat << 'INITSCRIPT' > ramdisk/init
          #!/split_init
          export PATH=/sbin:/system/bin:/system/xbin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys

          # Paksa USB RNDIS + ADB
          echo rndis,adb > /sys/class/android_usb/android0/enable || true

          # Jalankan autostart headless
          /init_headless.sh &

          exec /system/bin/init
          INITSCRIPT
          chmod +x ramdisk/init

          # 2. Buat skrip autostart chroot & tools
          cat << 'SCRIPT' > ramdisk/init_headless.sh
          #!/system/bin/sh
          setprop sys.usb.config rndis,adb
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          
          CHROOT_DIR="/data/linux_tools"
          if [ -d "$CHROOT_DIR" ]; then
            mount -o bind /dev $CHROOT_DIR/dev
            mount -o bind /dev/pts $CHROOT_DIR/dev/pts
            mount -t proc proc $CHROOT_DIR/proc
            mount -t sysfs sys $CHROOT_DIR/sys
            
            chroot $CHROOT_DIR /usr/bin/aria2c --enable-rpc --rpc-listen-all=true &
            chroot $CHROOT_DIR /usr/bin/tmux new-session -d -s main_session
          fi
          SCRIPT
          chmod +x ramdisk/init_headless.sh

          # Pack ramdisk ke cpio.gz
          cd ramdisk
          find . | cpio -o -H newc | gzip -9 > ../ramdisk.cpio.gz
          cd ..

      - name: Compile Dummy MSM8953 Kernel & Pack Boot Image
        run: |
          # Buat file kernel placeholder jika tidak ada kompilasi kernel mentah
          dd if=/dev/zero of=kernel_dummy bs=1M count=8
          
          mkbootimg \
            --kernel kernel_dummy \
            --ramdisk ramdisk.cpio.gz \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3 androidboot.emmc=true" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/boot.img

          cp ramdisk/init_headless.sh output/chroot_bundle/

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vince-barebone-fastboot
          path: output/
