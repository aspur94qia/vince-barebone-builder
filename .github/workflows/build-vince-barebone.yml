name: Vince Android Base + Alpine Chroot Tools

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-barebone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip aria2 android-sdk-libsparse-utils android-sdk-platform-tools-common p7zip-full

      - name: Download LineageOS 23.2 Vince ROM & Alpine Rootfs
        run: |
          mkdir -p work output/chroot_bundle
          echo "Downloading LineageOS 23.2 Vince..."
          ROM_URL="https://github.com/imren0x/LineageOS_vince/releases/download/20260507/lineage-23.2-20260506-UNOFFICIAL-vince.zip"
          aria2c -x16 -s16 -o work/lineage.zip "$ROM_URL"
          unzip work/lineage.zip boot.img -d output/

          echo "Downloading Alpine Linux Rootfs (ARM64)..."
          ALPINE_URL="https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/alpine-minirootfs-3.19.1-aarch64.tar.gz"
          aria2c -x16 -s16 -o work/alpine.tar.gz "$ALPINE_URL"
          mkdir -p output/chroot_bundle/rootfs
          tar -xzf work/alpine.tar.gz -C output/chroot_bundle/rootfs

      - name: Setup Alpine Chroot Services & Tools Installer
        run: |
          cat << 'SCRIPT' > output/chroot_bundle/init_headless.sh
          #!/system/bin/sh
          setprop sys.usb.config rndis,adb
          service call connectivity 33 i32 1 s16 "OpenWrt-Vince" s16 "" i32 0
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          
          CHROOT_DIR="/data/local/alpine"
          if [ -d "$CHROOT_DIR" ]; then
            mount -o bind /dev $CHROOT_DIR/dev
            mount -o bind /dev/pts $CHROOT_DIR/dev/pts
            mount -t proc proc $CHROOT_DIR/proc
            mount -t sysfs sys $CHROOT_DIR/sys
            chroot $CHROOT_DIR /bin/sh /etc/init_tools.sh &
          fi
          SCRIPT
          chmod +x output/chroot_bundle/init_headless.sh

          cat << 'TOOLS' > output/chroot_bundle/rootfs/etc/init_tools.sh
          #!/bin/sh
          apk add --no-network aria2 tmux screen nmap tcpdump vnstat wireguard-tools modemmanager bluez 2>/dev/null || true
          aria2c --enable-rpc --rpc-listen-all=true &
          tmux new-session -d -s vince_main
          TOOLS
          chmod +x output/chroot_bundle/rootfs/etc/init_tools.sh

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vince-android-alpine-fastboot
          path: output/
