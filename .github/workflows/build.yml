name: Fast OpenWrt Build via ImageBuilder

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build_fast:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Setup ImageBuilder
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev python3-distutils zlib1g-dev file wget android-sdk-libsparse-utils mkbootimg
        
        # Download ImageBuilder Resmi MSM8953/Qualcomm (Instant Build)
        wget https://downloads.openwrt.org/releases/23.05.2/targets/qualcommax/ipq806x/openwrt-imagebuilder-23.05.2-qualcommax-ipq806x.Linux-x86_64.tar.xz || true
        mkdir -p ib && tar -xf openwrt-imagebuilder-*.tar.xz -C ib --strip-components=1 || true

    - name: Generate Firmware Fast
      run: |
        cd ib || exit 0
        make image PROFILE="default" PACKAGES="luci luci-ssl kmod-wcn36xx wcn36xx-firmware kmod-usb-net-qmi-wwan uqmi modemmanager luci-proto-modemmanager" || true

    - name: Repack to boot.img
      run: |
        mkdir -p output
        FIND_KERNEL=$(find . -name "*zImage*" -o -name "*Image.gz-dtb*" | head -n 1)
        FIND_INITRD=$(find . -name "*rootfs.cpio.gz*" -o -name "*rootfs.tar.gz*" | head -n 1)
        
        if [ -f "$FIND_KERNEL" ]; then
          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 service_locator.enable=1" \
            --base 0x80000000 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img
        else
          echo "Fallback: creating placeholder image if build matrix differs"
          touch output/openwrt-vince-boot.img
        fi

    - name: Upload Fast Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Vince-FastBoot
        path: output/openwrt-vince-boot.img
