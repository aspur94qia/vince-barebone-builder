name: Build Vince Headless Barebone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean and Setup Build Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev openjdk-11-jdk python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Sync Source Code & Device Tree
      run: |
        mkdir android-build
        cd android-build
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
        
        # Branch device & vendor menggunakan lineage-20.0 yang valid
        git clone https://github.com/LineageOS/android_device_xiaomi_vince.git -b lineage-20.0 device/xiaomi/vince
        git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_vince.git -b lineage-20.0 vendor/xiaomi/vince
        git clone https://github.com/aspur94qia/vince_unitrix.git -b 4.19 kernel/xiaomi/vince
        
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Inject Custom Configurations & WebUI Scripts
      run: |
        cd android-build
        mkdir -p device/xiaomi/vince/rootdir/bin/
        cp ../scripts/autostart.sh device/xiaomi/vince/rootdir/bin/
        cp ../scripts/webadmin.py device/xiaomi/vince/rootdir/bin/

    - name: Compile Headless System & Boot Image
      run: |
        cd android-build
        source build/envsetup.sh
        lunch lineage_vince-userdebug
        make bootimage systemimage -j$(nproc --all)

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Vince-Headless-Kernel4.19
        path: |
          android-build/out/target/product/vince/boot.img
          android-build/out/target/product/vince/system.img
