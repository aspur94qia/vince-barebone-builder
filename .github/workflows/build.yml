name: Build Vince Headless Barebone

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean and Setup Build Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev openjdk-17-jdk python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Sync Source Code via Local Manifest
      run: |
        mkdir -p android-build
        cd android-build
        
        # Base OS diselaraskan ke LineageOS 21.0 (Android 14)
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
        mkdir -p .repo/local_manifests
        
        echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/vince.xml
        echo '<manifest>' >> .repo/local_manifests/vince.xml
        echo '  <project path="device/xiaomi/vince" name="LineageOS-Revived/android_device_xiaomi_vince" revision="fourteen" remote="github" />' >> .repo/local_manifests/vince.xml
        echo '  <project path="vendor/xiaomi/vince" name="TheMuppets/proprietary_vendor_xiaomi_vince" revision="lineage-21.0" remote="github" />' >> .repo/local_manifests/vince.xml
        echo '  <project path="kernel/xiaomi/vince" name="aspur94qia/vince_unitrix" revision="4.19" remote="github" />' >> .repo/local_manifests/vince.xml
        echo '</manifest>' >> .repo/local_manifests/vince.xml

        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Inject Custom Configurations & WebUI Scripts
      run: |
        cd android-build
        mkdir -p device/xiaomi/vince/rootdir/bin/
        cp ../scripts/autostart.sh device/xiaomi/vince/rootdir/bin/ 2>/dev/null || true
        cp ../scripts/webadmin.py device/xiaomi/vince/rootdir/bin/ 2>/dev/null || true

    - name: Compile Headless System & Boot Image
      run: |
        cd android-build
        source build/envsetup.sh
        lunch lineage_vince-ap1a-userdebug || lunch lineage_vince-userdebug
        make bootimage systemimage -j$(nproc --all)

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Vince-Headless-Kernel4.19
        path: |
          android-build/out/target/product/vince/boot.img
          android-build/out/target/product/vince/system.img
