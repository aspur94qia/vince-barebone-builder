name: Build OpenWrt for Xiaomi Redmi 5 Plus (vince)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build_openwrt:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone OpenWrt Source
      run: |
        git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure OpenWrt for Vince (MSM8953) & Packages
      run: |
        cd openwrt
        
        # Generasi Konfigurasi Target MSM8953 & Paket Wajib Modem/Extender
        cat << 'CONFIG' > .config
        CONFIG_TARGET_subtarget="msm8953"
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-app-firewall=y
        
        # Paket Driver Modem 4G / Seluler
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        
        # Paket Wireless & Extender (STA+AP / Wpad)
        CONFIG_PACKAGE_wpad-mesh-openssl=y
        CONFIG_PACKAGE_kmod-ath10k=y
        CONFIG_PACKAGE_ath10k-firmware-qca9887=y
        CONFIG_PACKAGE_wireless-regdb=y
        CONFIG_PACKAGE_luci-app-sqm=y
        CONFIG_PACKAGE_wireguard-tools=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG
        
        make defconfig

    - name: Download Package Sources
      run: |
        cd openwrt
        make download -j$(nproc)

    - name: Compile OpenWrt Firmware Image
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload OpenWrt Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Vince-Firmware
        path: |
          openwrt/bin/targets/*/*/*boot*.img
          openwrt/bin/targets/*/*/*.bin
          openwrt/bin/targets/*/*/*.gz
