name: Build OpenWrt for Xiaomi Redmi 5 Plus (vince)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build_openwrt:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          android-sdk-libsparse-utils mkbootimg

    - name: Clone OpenWrt MSM8953 Source
      run: |
        # Menggunakan Repo OpenWrt Porting khusus Qualcomm MSM8953
        git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure OpenWrt Driver & Packages (Vince Verified)
      run: |
        cd openwrt
        
        cat << 'CONFIG' > .config
        # Base Target & Subtarget
        CONFIG_TARGET_qualcommax=y
        
        # Web Admin Interface
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        
        # Driver Modem 4G (Internal Qualcomm RIL & QMI)
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_qmi-utils=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_luci-proto-qmi=y
        
        # Driver Wi-Fi Benar untuk Vince (Qualcomm WCN36xx)
        CONFIG_PACKAGE_kmod-wcn36xx=y
        CONFIG_PACKAGE_wcn36xx-firmware=y
        CONFIG_PACKAGE_wpad-basic-mbedtls=y
        CONFIG_PACKAGE_wireless-regdb=y
        
        # Tool Network & Extender
        CONFIG_PACKAGE_luci-app-sqm=y
        CONFIG_PACKAGE_wireguard-tools=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG
        
        make defconfig

    - name: Download Package Sources
      run: |
        cd openwrt
        make download -j$(nproc)

    - name: Compile OpenWrt Kernel & Rootfs
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Pack to Android boot.img Format
      run: |
        mkdir -p output
        # Mengemas Kernel OpenWrt & Initramfs menjadi boot.img Android
        FIND_KERNEL=$(find openwrt/bin/targets/ -name "*zImage*" -o -name "*Image.gz-dtb*" | head -n 1)
        FIND_INITRD=$(find openwrt/bin/targets/ -name "*rootfs.cpio.gz*" | head -n 1)
        
        if [ -f "$FIND_KERNEL" ]; then
          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 service_locator.enable=1" \
            --base 0x80000000 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img
          echo "Success created openwrt-vince-boot.img"
        else
          echo "Warning: Firmware build failed to create zImage"
        fi

    - name: Upload OpenWrt Flashable Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Vince-Flashable
        path: |
          output/openwrt-vince-boot.img
          openwrt/bin/targets/*/*/*
