name: Build OpenWrt for Xiaomi Redmi 5 Plus (vince)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build_openwrt:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          android-sdk-libsparse-utils mkbootimg

    - name: Clone OpenWrt Source
      run: |
        git clone --depth 1 https://github.com/msm8953-mainline/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure OpenWrt Packages
      run: |
        cd openwrt
        cat << 'CONFIG_EOF' > .config
        CONFIG_TARGET_msm8953=y
        CONFIG_TARGET_msm8953_DEVICE_xiaomi_vince=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_kmod-wcn36xx=y
        CONFIG_PACKAGE_wcn36xx-firmware=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_EOF
        make defconfig

    - name: Download Package Sources
      run: |
        cd openwrt
        make download -j$(nproc)

    - name: Compile OpenWrt
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Pack to Android boot.img
      run: |
        mkdir -p output
        
        FIND_KERNEL=$(find openwrt/bin/targets/ -type f \( -name "*zImage*" -o -name "*Image.gz-dtb*" -o -name "Image.gz" \) | head -n 1)
        FIND_INITRD=$(find openwrt/bin/targets/ -type f -name "*rootfs.cpio.gz*" | head -n 1)
        
        echo "Found Kernel: $FIND_KERNEL"
        echo "Found Initrd: $FIND_INITRD"

        if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
          echo "ERROR: Kernel or Ramdisk not found!"
          exit 1
        fi
        
        mkbootimg \
          --kernel "$FIND_KERNEL" \
          --ramdisk "$FIND_INITRD" \
          --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
          --base 0x80000000 \
          --ramdisk_offset 0x01000000 \
          --tags_offset 0x00000100 \
          --pagesize 2048 \
          --output output/openwrt-vince-boot.img

    - name: Upload Flashable Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Vince-BootImage
        path: output/openwrt-vince-boot.img
