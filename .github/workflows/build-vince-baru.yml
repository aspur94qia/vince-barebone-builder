name: Super Fast Image Builder

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 mkbootimg

      - name: Download & Extract Image Builder
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/armvirt/64/openwrt-imagebuilder-23.05.3-armvirt-64.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-*.tar.xz
          mv openwrt-imagebuilder-*/ imagebuilder/

      - name: Build Image
        run: |
          cd imagebuilder
          make image PROFILE="Default" PACKAGES="zram-swap docker dockerd luci-app-dockerman kmod-sound-core ksmbd-server aria2 travelmate luci-app-ttyd tailscale netdata mwan3 block-mount e2fsprogs kmod-fs-ext4"

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find imagebuilder/bin/targets/ -type f \( -name "*Image*" -o -name "*zImage*" \) | head -n 1)
          FIND_INITRD=$(find imagebuilder/bin/targets/ -type f \( -name "*.cpio.gz" -o -name "*initramfs*" -o -name "*rootfs*" \) | head -n 1)
          
          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
