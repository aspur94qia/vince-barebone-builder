name: Fast Container OpenWrt Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Container & Dependencies
        run: |
          apt-get update
          # Install semua kebutuhan tanpa konfirmasi
          DEBIAN_FRONTEND=noninteractive apt-get install -y sudo git build-essential libncurses-dev zlib1g-dev gawk gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget
          pip3 install pycryptodome
          
          # Buat user non-root karena OpenWrt menolak di-build pakai root
          useradd -m builder
          chown -R builder:builder .

      - name: Clone & Compile OpenWrt
        run: |
          # Eksekusi kompilasi menggunakan user 'builder'
          sudo -u builder bash -c '
            git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
            cd openwrt
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            make defconfig
            make download -j$(nproc)
            make -j$(nproc) || make -j1 V=s
          '

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find openwrt/bin/targets/ -type f \( -name "*zImage*" -o -name "*Image*" -o -name "*vmlinux*" \) | head -n 1)
          FIND_INITRD=$(find openwrt/bin/targets/ -type f \( -name "*.cpio.gz" -o -name "*initramfs*" -o -name "*rootfs*" \) | head -n 1)
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
