name: Final Container OpenWrt Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Container & Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y sudo git build-essential libncurses5-dev zlib1g-dev gawk gettext libssl-dev xsltproc rsync unzip python3 mkbootimg wget curl
          
          useradd -m builder
          chown -R builder:builder .

      - name: Download & Extract Image Builder
        run: |
          sudo -u builder bash -c '
            # Ambil link file Image Builder armvirt-64 terbaru secara otomatis dari server resmi
            LATEST_URL=$(curl -s https://downloads.openwrt.org/releases/ | grep -oE "href=\"v[0-9.]+\/\"" | tail -n 1 | tr -d "href=\"/")
            echo "Using OpenWrt version: $LATEST_URL"
            
            BUILDER_LINK="https://downloads.openwrt.org/releases/${LATEST_URL}/targets/armvirt/64/openwrt-imagebuilder-${LATEST_URL}-armvirt-64.Linux-x86_64.tar.xz"
            
            wget "$BUILDER_LINK" || wget "$(curl -s https://downloads.openwrt.org/releases/ | grep -oE "href=\"23\.[0-9.]+\/\"" | tail -n 1 | tr -d "href=\"/" | awk '{print "https://downloads.openwrt.org/releases/" $1 "/targets/armvirt/64/openwrt-imagebuilder-" $1 "-armvirt-64.Linux-x86_64.tar.xz"}')"
            
            tar -xf openwrt-imagebuilder-*.tar.xz
            mv openwrt-imagebuilder-*/ imagebuilder/
          '

      - name: Build Custom Image
        run: |
          sudo -u builder bash -c '
            cd imagebuilder
            make image PROFILE="Default" PACKAGES="zram-swap docker dockerd luci-app-dockerman kmod-sound-core ksmbd-server aria2 travelmate luci-app-ttyd tailscale netdata mwan3 block-mount e2fsprogs kmod-fs-ext4"
          '

      - name: Pack to boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find imagebuilder/bin/targets/ -type f \( -name "*Image*" -o -name "*zImage*" \) | head -n 1)
          FIND_INITRD=$(find imagebuilder/bin/targets/ -type f \( -name "*.cpio.gz" -o -name "*initramfs*" -o -name "*rootfs*" \) | head -n 1)
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
