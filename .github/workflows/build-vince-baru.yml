name: Fresh OpenWrt Vince Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Inside Container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget file
          pip3 install pycryptodome

      - name: Clone OpenWrt & Install Feeds
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Qualcomm Firmware, Auto Bluetooth Speaker & SIM Config
        run: |
          cd openwrt
          
          # Firmware Bluetooth Qualcomm
          mkdir -p files/lib/firmware/qcom
          wget -q -O files/lib/firmware/qcom/rampatch_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/rampatch_00230302.bin || true
          wget -q -O files/lib/firmware/qcom/nvm_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/nvm_00230302.bin || true
          
          # Konfigurasi Bluetooth Speaker
          mkdir -p files/etc/bluetooth
          cat << 'BTCONF' > files/etc/bluetooth/main.conf
          [General]
          Name = OpenWrt Vince Speaker
          Class = 0x240404
          DiscoverableTimeout = 0
          PairableTimeout = 0
          BTCONF

          # Skrip First Boot Auto-Connect SIM & Bluetooth Receiver Mode
          mkdir -p files/etc/uci-defaults
          cat << 'SCRIPT' > files/etc/uci-defaults/99-vince-init
          #!/bin/sh
          
          # Auto-connect SIM Card
          uci set network.wan=interface
          uci set network.wan.proto='modemmanager'
          uci set network.wan.apn='internet'
          uci set network.wan.pdptype='ipv4v6'
          uci set network.wan.metric='10'
          uci set network.wan.autoconnect='1'
          uci commit network
          
          # Start Bluetooth Qualcomm & Auto Discoverable
          hciattach -s 115200 /dev/ttyHS0 qca 3000000 flow || true
          /etc/init.d/bluetooth enable
          /etc/init.d/bluetooth start
          
          bluealsad -p a2dp-sink &
          sleep 2
          bluetoothctl power on
          bluetoothctl pairable on
          bluetoothctl discoverable on
          bluetoothctl agent NoInputNoOutput
          bluetoothctl default-agent
          
          /etc/init.d/modemmanager enable
          /etc/init.d/modemmanager start
          
          exit 0
          SCRIPT
          chmod +x files/etc/uci-defaults/99-vince-init

      - name: Configure Armvirt Target & Packages
        run: |
          cd openwrt
          
          # Lock Target Board & Subtarget Armvirt 64-bit secara Mutlak
          echo 'CONFIG_TARGET_BOARD="armvirt"' > .config
          echo 'CONFIG_TARGET_SUBTARGET="64"' >> .config
          echo 'CONFIG_TARGET_armvirt=y' >> .config
          echo 'CONFIG_TARGET_armvirt_64=y' >> .config
          echo 'CONFIG_TARGET_armvirt_64_Default=y' >> .config
          echo 'CONFIG_TARGET_PROFILE="Default"' >> .config
          
          # Driver Modem SIM Card Internal Qualcomm (QMI & ModemManager)
          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_libqmi=y" >> .config
          echo "CONFIG_PACKAGE_qmi-utils=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qmi-wwan=y" >> .config
          echo "CONFIG_PACKAGE_wwan=y" >> .config
          echo "CONFIG_PACKAGE_qrtr-tools=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qrtr=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qrtr-smd=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qrtr-tun=y" >> .config
          
          # Hardware Suara & Bluetooth Internal
          echo "CONFIG_PACKAGE_kmod-sound-core=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sound-soc-core=y" >> .config
          echo "CONFIG_PACKAGE_alsa-utils=y" >> .config
          echo "CONFIG_PACKAGE_alsa-ucm-conf=y" >> .config
          echo "CONFIG_PACKAGE_kmod-bluetooth=y" >> .config
          echo "CONFIG_PACKAGE_kmod-bt-hci-uart=y" >> .config
          echo "CONFIG_PACKAGE_bluez-daemon=y" >> .config
          echo "CONFIG_PACKAGE_bluez-utils=y" >> .config
          echo "CONFIG_PACKAGE_bluealsa=y" >> .config
          
          # LuCI UI & Web Terminal
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          # Wi-Fi & Repeater (WISP)
          echo "CONFIG_PACKAGE_wpad-mbedtls=y" >> .config
          echo "CONFIG_PACKAGE_travelmate=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-travelmate=y" >> .config
          echo "CONFIG_PACKAGE_relayd=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-relay=y" >> .config
          
          # USB Tethering & Support Modem USB
          echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config
          
          # Storage & Partisi eMMC
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_fdisk=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-aria2=y" >> .config
          
          # Network Switcher, Bandwidth Monitor & Security
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_vnstat2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-vnstat2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> .config
          echo "CONFIG_PACKAGE_https-dns-proxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-https-dns-proxy=y" >> .config
          echo "CONFIG_PACKAGE_sqm=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
          echo "CONFIG_PACKAGE_tailscale=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
          
          # Utilitas Terminal
          echo "CONFIG_PACKAGE_nano=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config
          echo "CONFIG_PACKAGE_bash=y" >> .config
          
          make defconfig
          
          # Verifikasi target
          if ! grep -q "CONFIG_TARGET_armvirt=y" .config; then
            echo "ERROR: Target armvirt masih ter-reset!"
            exit 1
          fi

      - name: Download Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile OpenWrt
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/tar/clean || true
          make -j1 V=s tools/tar/compile FORCE_UNSAFE_CONFIGURE=1 || true
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find openwrt/bin/targets/armvirt/ -type f \( -name "Image" -o -name "zImage" -o -name "vmlinux" \) | head -n 1)
          FIND_INITRD=$(find openwrt/bin/targets/armvirt/ -type f \( -name "*rootfs*.cpio.gz" -o -name "*initramfs*.cpio.gz" -o -name "*rootfs*.img" \) | head -n 1)
          
          echo "Found Kernel: $FIND_KERNEL"
          echo "Found Initrd: $FIND_INITRD"
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            find openwrt/bin/targets/ -type f
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
