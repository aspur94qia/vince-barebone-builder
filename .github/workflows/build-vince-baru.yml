name: OpenWrt ImageBuilder Vince (All Packages Included)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget file
          pip3 install pycryptodome

      - name: Download & Extract ImageBuilder 22.03.7
        run: |
          IB_URL="https://archive.openwrt.org/releases/22.03.7/targets/armvirt/64/openwrt-imagebuilder-22.03.7-armvirt-64.Linux-x86_64.tar.xz"
          wget -q "$IB_URL" -O ib.tar.xz
          
          mkdir -p imagebuilder
          tar -xf ib.tar.xz -C imagebuilder --strip-components=1

      - name: Prepare Custom Files, Extra IPKs & Firmware
        run: |
          cd imagebuilder
          
          mkdir -p tmp
          mkdir -p files/lib/firmware/qcom
          mkdir -p files/lib/firmware/wcn36xx
          mkdir -p files/etc/bluetooth
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/config
          mkdir -p files/etc/crontabs
          mkdir -p files/root/extra_packages

          # 1. Download Firmware Wi-Fi WCN36xx & Bluetooth Qualcomm
          wget -q -O files/lib/firmware/qcom/rampatch_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/rampatch_00230302.bin || true
          wget -q -O files/lib/firmware/qcom/nvm_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/nvm_00230302.bin || true
          wget -q -O files/lib/firmware/wcn36xx/wcn3680_qcom_wcnss.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/wcn36xx/wcn3680_qcom_wcnss.bin || true
          
          # 2. Download IPK tambahan ke dalam /root/extra_packages
          wget -q -P files/root/extra_packages/ https://downloads.openwrt.org/releases/22.03.7/packages/aarch64_generic/packages/bluealsa_0.10.0-1_aarch64_generic.ipk || true
          wget -q -P files/root/extra_packages/ https://downloads.openwrt.org/releases/22.03.7/packages/aarch64_generic/base/qrtr-tools_1.0-1_aarch64_generic.ipk || true

          # 3. Konfigurasi Bluetooth Audio Receiver (A2DP Sink)
          echo "[General]" > files/etc/bluetooth/main.conf
          echo "Name = OpenWrt Vince Audio Receiver" >> files/etc/bluetooth/main.conf
          echo "Class = 0x20041C" >> files/etc/bluetooth/main.conf
          echo "DiscoverableTimeout = 0" >> files/etc/bluetooth/main.conf
          echo "PairableTimeout = 0" >> files/etc/bluetooth/main.conf

          # 4. Skrip First Boot (Auto Hotspot, Auto SIM, BT Receiver, Auto Switch Headset/Speaker)
          cat << 'SCRIPT' > files/etc/uci-defaults/99-vince-init
          #!/bin/sh
          
          # Auto Install IPK ekstra jika ada
          if [ -d /root/extra_packages ]; then
            opkg install /root/extra_packages/*.ipk || true
          fi
          
          # Auto TTL 64 Bypass via iptables
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          iptables -t mangle -A PREROUTING -j TTL --ttl-set 64 || true
          
          # Auto-connect SIM Card
          uci set network.wan=interface
          uci set network.wan.proto='modemmanager'
          uci set network.wan.apn='internet'
          uci set network.wan.pdptype='ipv4v6'
          uci set network.wan.metric='10'
          uci set network.wan.autoconnect='1'
          uci commit network
          
          # Buat & Paksa Aktifkan Wi-Fi Hotspot OpenWrt-Vince
          wifi detect > /etc/config/wireless || true
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload || true
          
          # Matikan Backlight Layar Otomatis (HP Adem & Baterai Awet)
          echo 0 > /sys/class/backlight/panel0-backlight/brightness || true
          
          # Auto Reboot Tiap Jam 04:00 Pagi
          echo "0 4 * * * /sbin/reboot" >> /etc/crontabs/root
          
          # Start Bluetooth Qualcomm & Auto Discoverable
          hciattach -s 115200 /dev/ttyHS0 qca 3000000 flow || true
          /etc/init.d/bluetooth enable
          /etc/init.d/bluetooth start
          
          # Run BlueALSA Receiver Daemon (Mode A2DP Sink)
          bluealsad -p a2dp-sink --a2dp-force-audio-cd &
          sleep 2
          
          bluetoothctl power on
          bluetoothctl pairable on
          bluetoothctl discoverable on
          bluetoothctl agent NoInputNoOutput
          bluetoothctl default-agent
          
          # Skrip Auto-Detect Headset / Speaker ALSA Routing
          cat << 'AUDIOSWITCH' > /usr/bin/auto-audio-switch.sh
          #!/bin/sh
          while true; do
            HEADSET_CONNECTED=$(amixer sget 'Headphone Jack' 2>/dev/null | grep -i 'Item0:' | grep -i 'on')
            if [ -n "$HEADSET_CONNECTED" ]; then
              amixer sset 'RX INT DAC' on || true
              amixer sset 'Headphone' on || true
              amixer sset 'Speaker' off || true
            else
              amixer sset 'RX INT DAC' on || true
              amixer sset 'Speaker' on || true
              amixer sset 'Headphone' off || true
            fi
            sleep 3
          done
          AUDIOSWITCH
          chmod +x /usr/bin/auto-audio-switch.sh
          /usr/bin/auto-audio-switch.sh &
          
          /etc/init.d/modemmanager enable
          /etc/init.d/modemmanager start
          
          exit 0
          SCRIPT
          chmod +x files/etc/uci-defaults/99-vince-init

      - name: Build Full Image with Native Compatible Packages
        run: |
          cd imagebuilder
          
          # Seluruh paket utama + tools tambahan resmi yang 100% lolos kompilasi
          PACKAGES="luci luci-ssl luci-theme-bootstrap luci-app-ttyd modemmanager luci-proto-modemmanager libqmi qmi-utils wwan wpad-basic kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-serial kmod-usb-serial-option usb-modeswitch block-mount kmod-fs-ext4 e2fsprogs fdisk luci-app-samba4 alsa-utils alsa-ucm-conf bluez-daemon bluez-utils kmod-tcp-bbr zram-swap kmod-zram wget-ssl curl bash nano htop aria2 luci-app-mwan3 luci-app-watchcat luci-app-wireguard luci-app-vnstat iperf3 tcpdump nmap screen tmux -ppp -ppp-mod-pppoe"
          
          make image PROFILE="Default" PACKAGES="$PACKAGES" FILES="files"

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find imagebuilder/bin/targets/armvirt/64/ -type f -name "*-Image" | head -n 1)
          FIND_INITRD=$(find imagebuilder/bin/targets/armvirt/64/ -type f \( -name "*-rootfs.cpio.gz" -o -name "*-ext4.img.gz" -o -name "*-rootfs.img" \) | head -n 1)
          
          echo "Found Kernel: $FIND_KERNEL"
          echo "Found Initrd: $FIND_INITRD"
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
