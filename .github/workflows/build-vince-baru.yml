name: Fresh OpenWrt Vince Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Inside Container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget file
          pip3 install pycryptodome

      - name: Clone OpenWrt 23.05 Stable & Add Feeds
        run: |
          git clone --depth 1 -b openwrt-23.05 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Clone Tools Tambahan (Tanpa Argon untuk menghindari error wget-any)
          mkdir -p package/custom
          git clone --depth 1 https://github.com/obsy/luci-app-modemband.git package/custom/luci-app-modemband || true
          git clone --depth 1 https://github.com/obsy/luci-app-sms-tool.git package/custom/luci-app-sms-tool || true
          git clone --depth 1 https://github.com/kostevanchuk/luci-app-atcommands.git package/custom/luci-app-atcommands || true
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/custom/luci-app-openclash || true
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall.git package/custom/passwall || true
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/custom/passwall-packages || true
          git clone --depth 1 https://github.com/sbwml/luci-app-filemanager.git package/custom/luci-app-filemanager || true

          # Bersihkan paket duplikat dari passwall-packages yang bentrok dengan official feeds
          rm -rf package/custom/passwall-packages/chinadns-ng
          rm -rf package/custom/passwall-packages/dns2tcp
          rm -rf package/custom/passwall-packages/shadowsocks-rust

      - name: Inject Firmware, Auto Configs, Auto TTL & Init Scripts
        run: |
          cd openwrt
          
          # 1. Firmware Wi-Fi WCN36xx & Bluetooth Qualcomm
          mkdir -p files/lib/firmware/qcom
          mkdir -p files/lib/firmware/wcn36xx
          wget -q -O files/lib/firmware/qcom/rampatch_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/rampatch_00230302.bin || true
          wget -q -O files/lib/firmware/qcom/nvm_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/nvm_00230302.bin || true
          wget -q -O files/lib/firmware/wcn36xx/wcn3680_qcom_wcnss.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/wcn36xx/wcn3680_qcom_wcnss.bin || true
          
          # 2. Konfigurasi Bluetooth Speaker
          mkdir -p files/etc/bluetooth
          cat << 'BTCONF' > files/etc/bluetooth/main.conf
          [General]
          Name = OpenWrt Vince Speaker
          Class = 0x240404
          DiscoverableTimeout = 0
          PairableTimeout = 0
          BTCONF

          # 3. Skrip First Boot (Auto TTL 64, Auto SIM, Power Save & Auto Reboot Jam 4 Pagi)
          mkdir -p files/etc/uci-defaults
          cat << 'SCRIPT' > files/etc/uci-defaults/99-vince-init
          #!/bin/sh
          
          # Auto TTL 64 Bypass via iptables
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          iptables -t mangle -A PREROUTING -j TTL --ttl-set 64 || true
          
          # Auto-connect SIM Card
          uci set network.wan=interface
          uci set network.wan.proto='modemmanager'
          uci set network.wan.apn='internet'
          uci set network.wan.pdptype='ipv4v6'
          uci set network.wan.metric='10'
          uci set network.wan.autoconnect='1'
          uci commit network
          
          # Matikan Backlight Layar Otomatis (HP Adem & Baterai Awet)
          echo 0 > /sys/class/backlight/panel0-backlight/brightness || true
          
          # Auto Reboot Tiap Jam 04:00 Pagi (Refresh RAM & Sinyal)
          mkdir -p files/etc/crontabs
          echo "0 4 * * * /sbin/reboot" >> files/etc/crontabs/root
          
          # Start Bluetooth Qualcomm & Auto Discoverable
          hciattach -s 115200 /dev/ttyHS0 qca 3000000 flow || true
          /etc/init.d/bluetooth enable
          /etc/init.d/bluetooth start
          
          bluealsad -p a2dp-sink &
          sleep 2
          bluetoothctl power on
          bluetoothctl pairable on
          bluetoothctl discoverable on
          bluetoothctl agent NoInputNoOutput
          bluetoothctl default-agent
          
          /etc/init.d/modemmanager enable
          /etc/init.d/modemmanager start
          
          exit 0
          SCRIPT
          chmod +x files/etc/uci-defaults/99-vince-init

      - name: Configure Armvirt Target & Stable Packages
        run: |
          cd openwrt
          
          # Inisialisasi seed config utuh
          cat << 'EOF' > .config
          CONFIG_TARGET_armvirt=y
          CONFIG_TARGET_armvirt_64=y
          CONFIG_TARGET_armvirt_64_Default=y

          # Dependensi Dasar
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_bash=y

          # Wi-Fi Userspace
          CONFIG_PACKAGE_wpad-mbedtls=y

          # Driver Modem SIM Card Internal Qualcomm & TTL Fix
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_libqmi=y
          CONFIG_PACKAGE_qmi-utils=y
          CONFIG_PACKAGE_wwan=y
          CONFIG_PACKAGE_qrtr-tools=y

          # Modem & SIM Tools (Band Locker, SMS/USSD, AT Commands)
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_luci-app-sms-tool=y
          CONFIG_PACKAGE_luci-app-atcommands=y
          CONFIG_PACKAGE_sms-tool=y

          # Tunneling & Injeksi Internet
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall=y

          # Optimasi TCP BBR, SmartDNS & ZRAM Swap
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_kmod-zram=y

          # Sound & Bluetooth Userspace Stack
          CONFIG_PACKAGE_alsa-utils=y
          CONFIG_PACKAGE_alsa-ucm-conf=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_bluealsa=y

          # LuCI UI (Menggunakan tema default Bootstrap/Material yang stabil)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y

          # Wi-Fi Repeater (WISP) & Multi-WAN Switcher
          CONFIG_PACKAGE_travelmate=y
          CONFIG_PACKAGE_luci-app-travelmate=y
          CONFIG_PACKAGE_relayd=y
          CONFIG_PACKAGE_luci-proto-relay=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # USB Tethering & Support Modem USB
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # Storage & Partisi eMMC
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-aria2=y

          # Bandwidth Monitor, Security & VPN Remote
          CONFIG_PACKAGE_vnstat=y
          CONFIG_PACKAGE_luci-app-vnstat=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_https-dns-proxy=y
          CONFIG_PACKAGE_luci-app-https-dns-proxy=y
          CONFIG_PACKAGE_sqm=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-wireguard=y

          # Utilitas Terminal CLI
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_htop=y
          EOF

          make defconfig

          # Verifikasi target armvirt
          if ! grep -q 'CONFIG_TARGET_BOARD="armvirt"' .config && ! grep -q 'CONFIG_TARGET_armvirt_64=y' .config; then
            echo "ERROR: Target armvirt ter-reset!"
            exit 1
          fi

      - name: Download Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile OpenWrt
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/tar/clean || true
          make -j1 V=s tools/tar/compile FORCE_UNSAFE_CONFIGURE=1 || true
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find openwrt/bin/targets/armvirt/ -type f \( -name "Image" -o -name "zImage" -o -name "vmlinux" \) | head -n 1)
          FIND_INITRD=$(find openwrt/bin/targets/armvirt/ -type f \( -name "*rootfs*.cpio.gz" -o -name "*initramfs*.cpio.gz" -o -name "*rootfs*.img" \) | head -n 1)
          
          echo "Found Kernel: $FIND_KERNEL"
          echo "Found Initrd: $FIND_INITRD"
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            find openwrt/bin/targets/ -type f
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
