name: OpenWrt Docker ImageBuilder (Fast Build)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget file
          pip3 install pycryptodome

      - name: Prepare Custom Files & Firmware
        run: |
          # 1. Buat direktori files untuk disuntikkan ke dalam image
          mkdir -p custom-files/lib/firmware/qcom
          mkdir -p custom-files/lib/firmware/wcn36xx
          mkdir -p custom-files/etc/bluetooth
          mkdir -p custom-files/etc/uci-defaults
          mkdir -p custom-files/etc/crontabs

          # 2. Download Firmware Wi-Fi WCN36xx & Bluetooth Qualcomm
          wget -q -O custom-files/lib/firmware/qcom/rampatch_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/rampatch_00230302.bin || true
          wget -q -O custom-files/lib/firmware/qcom/nvm_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/nvm_00230302.bin || true
          wget -q -O custom-files/lib/firmware/wcn36xx/wcn3680_qcom_wcnss.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/wcn36xx/wcn3680_qcom_wcnss.bin || true
          
          # 3. Konfigurasi Bluetooth Speaker
          cat << 'BTCONF' > custom-files/etc/bluetooth/main.conf
          [General]
          Name = OpenWrt Vince Speaker
          Class = 0x240404
          DiscoverableTimeout = 0
          PairableTimeout = 0
          BTCONF

          # 4. Skrip First Boot (Auto TTL 64, Auto SIM, Power Save & Auto Reboot Jam 4 Pagi)
          cat << 'SCRIPT' > custom-files/etc/uci-defaults/99-vince-init
          #!/bin/sh
          
          # Auto TTL 64 Bypass via iptables
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          iptables -t mangle -A PREROUTING -j TTL --ttl-set 64 || true
          
          # Auto-connect SIM Card
          uci set network.wan=interface
          uci set network.wan.proto='modemmanager'
          uci set network.wan.apn='internet'
          uci set network.wan.pdptype='ipv4v6'
          uci set network.wan.metric='10'
          uci set network.wan.autoconnect='1'
          uci commit network
          
          # Matikan Backlight Layar Otomatis (HP Adem & Baterai Awet)
          echo 0 > /sys/class/backlight/panel0-backlight/brightness || true
          
          # Auto Reboot Tiap Jam 04:00 Pagi (Refresh RAM & Sinyal)
          echo "0 4 * * * /sbin/reboot" >> custom-files/etc/crontabs/root
          
          # Start Bluetooth Qualcomm & Auto Discoverable
          hciattach -s 115200 /dev/ttyHS0 qca 3000000 flow || true
          /etc/init.d/bluetooth enable
          /etc/init.d/bluetooth start
          
          bluealsad -p a2dp-sink &
          sleep 2
          bluetoothctl power on
          bluetoothctl pairable on
          bluetoothctl discoverable on
          bluetoothctl agent NoInputNoOutput
          bluetoothctl default-agent
          
          /etc/init.d/modemmanager enable
          /etc/init.d/modemmanager start
          
          exit 0
          SCRIPT
          chmod +x custom-files/etc/uci-defaults/99-vince-init

      - name: Build Image via Official OpenWrt Docker ImageBuilder
        run: |
          mkdir -p output-builder
          
          # Menggunakan Image official Docker OpenWrt khusus target armvirt-64
          docker run --rm \
            -v "$(pwd)/custom-files:/builder/files" \
            -v "$(pwd)/output-builder:/builder/bin" \
            openwrt/imagebuilder:armvirt-64-v23.05.5 \
            make image PACKAGES="luci luci-ssl luci-theme-bootstrap modemmanager luci-proto-modemmanager libqmi qmi-utils wwan qrtr-tools wpad-mbedtls block-mount kmod-fs-ext4 e2fsprogs nano htop"

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find output-builder/ -type f \( -name "Image" -o -name "zImage" -o -name "vmlinux" \) | head -n 1)
          FIND_INITRD=$(find output-builder/ -type f \( -name "*rootfs*.cpio.gz" -o -name "*initramfs*.cpio.gz" -o -name "*rootfs*.img" \) | head -n 1)
          
          echo "Found Kernel: $FIND_KERNEL"
          echo "Found Initrd: $FIND_INITRD"
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            find output-builder/ -type f
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
