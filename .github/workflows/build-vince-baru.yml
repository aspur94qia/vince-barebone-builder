name: Fresh OpenWrt Vince Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Inside Container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 python3-pip mkbootimg android-sdk-libsparse-utils android-sdk-platform-tools-common wget file
          pip3 install pycryptodome

      - name: Clone OpenWrt, Clean Feeds & Add Custom Packages
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          
          # Hapus feed video dari konfig default
          sed -i '/video/d' feeds.conf.default
          
          ./scripts/feeds update -a
          
          # Hapus paket bermasalah BESERTA aplikasi LuCI penyertanya
          rm -rf feeds/packages/net/fwknop
          rm -rf feeds/luci/applications/luci-app-fwknopd
          rm -rf feeds/packages/sound/squeezelite
          
          ./scripts/feeds install -a
          
          # Clone Tema Argon & Tools Tambahan ke folder custom
          mkdir -p package/custom
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/custom/luci-theme-argon || true
          git clone --depth 1 https://github.com/4230/luci-app-modemband.git package/custom/luci-app-modemband || true
          git clone --depth 1 https://github.com/4230/luci-app-sms-tool.git package/custom/luci-app-sms-tool || true
          git clone --depth 1 https://github.com/kostevanchuk/luci-app-atcommands.git package/custom/luci-app-atcommands || true
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/custom/luci-app-openclash || true
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall.git package/custom/passwall || true
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/custom/passwall-packages || true
          git clone --depth 1 https://github.com/sbwml/luci-app-filemanager.git package/custom/luci-app-filemanager || true

          # Hapus paket duplikat dari passwall-packages yang bentrok dengan official feeds
          rm -rf package/custom/passwall-packages/chinadns-ng
          rm -rf package/custom/passwall-packages/dns2tcp

      - name: Inject Firmware, Auto Configs, Auto TTL & Init Scripts
        run: |
          cd openwrt
          
          # 1. Firmware Wi-Fi WCN36xx & Bluetooth Qualcomm
          mkdir -p files/lib/firmware/qcom
          mkdir -p files/lib/firmware/wcn36xx
          wget -q -O files/lib/firmware/qcom/rampatch_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/rampatch_00230302.bin || true
          wget -q -O files/lib/firmware/qcom/nvm_00230302.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/qcom/nvm_00230302.bin || true
          wget -q -O files/lib/firmware/wcn36xx/wcn3680_qcom_wcnss.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/wcn36xx/wcn3680_qcom_wcnss.bin || true
          
          # 2. Konfigurasi Bluetooth Speaker
          mkdir -p files/etc/bluetooth
          cat << 'BTCONF' > files/etc/bluetooth/main.conf
          [General]
          Name = OpenWrt Vince Speaker
          Class = 0x240404
          DiscoverableTimeout = 0
          PairableTimeout = 0
          BTCONF

          # 3. Skrip First Boot (Auto TTL 64, Auto SIM, Power Save & Auto Reboot Jam 4 Pagi)
          mkdir -p files/etc/uci-defaults
          cat << 'SCRIPT' > files/etc/uci-defaults/99-vince-init
          #!/bin/sh
          
          # Auto TTL 64 Bypass via iptables
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 || true
          iptables -t mangle -A PREROUTING -j TTL --ttl-set 64 || true
          
          # Auto-connect SIM Card
          uci set network.wan=interface
          uci set network.wan.proto='modemmanager'
          uci set network.wan.apn='internet'
          uci set network.wan.pdptype='ipv4v6'
          uci set network.wan.metric='10'
          uci set network.wan.autoconnect='1'
          uci commit network
          
          # Matikan Backlight Layar Otomatis (HP Adem & Baterai Awet)
          echo 0 > /sys/class/backlight/panel0-backlight/brightness || true
          
          # Auto Reboot Tiap Jam 04:00 Pagi (Refresh RAM & Sinyal)
          mkdir -p /etc/crontabs
          echo "0 4 * * * /sbin/reboot" >> /etc/crontabs/root
          /etc/init.d/cron enable || true
          
          # Start Bluetooth Qualcomm & Auto Discoverable
          hciattach -s 115200 /dev/ttyHS0 qca 3000000 flow || true
          /etc/init.d/bluetooth enable
          /etc/init.d/bluetooth start
          
          bluealsad -p a2dp-sink &
          sleep 2
          bluetoothctl power on
          bluetoothctl pairable on
          bluetoothctl discoverable on
          bluetoothctl agent NoInputNoOutput
          bluetoothctl default-agent
          
          /etc/init.d/modemmanager enable
          /etc/init.d/modemmanager start
          
          exit 0
          SCRIPT
          chmod +x files/etc/uci-defaults/99-vince-init

      - name: Configure Armvirt Target & Single-Pass Packages
        run: |
          cd openwrt
          
          # 1. Kunci Target Armvirt 64-bit Terlebih Dahulu
          echo "CONFIG_TARGET_armvirt=y" > .config
          echo "CONFIG_TARGET_armvirt_64=y" >> .config
          echo "CONFIG_TARGET_armvirt_64_Default=y" >> .config
          make defconfig

          # Berikan izin eksekusi ke scripts/config
          chmod +x ./scripts/config

          # 2. Aktifkan Seluruh Paket Menggunakan scripts/config
          ./scripts/config --enable CONFIG_PACKAGE_wpad-mbedtls
          ./scripts/config --enable CONFIG_PACKAGE_modemmanager
          ./scripts/config --enable CONFIG_PACKAGE_luci-proto-modemmanager
          ./scripts/config --enable CONFIG_PACKAGE_libqmi
          ./scripts/config --enable CONFIG_PACKAGE_qmi-utils
          ./scripts/config --enable CONFIG_PACKAGE_wwan
          ./scripts/config --enable CONFIG_PACKAGE_qrtr-tools
          
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-modemband
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-sms-tool
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-atcommands
          ./scripts/config --enable CONFIG_PACKAGE_sms-tool
          
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-openclash
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-passwall
          
          ./scripts/config --enable CONFIG_PACKAGE_kmod-tcp-bbr
          ./scripts/config --enable CONFIG_PACKAGE_smartdns
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-smartdns
          ./scripts/config --enable CONFIG_PACKAGE_zram-swap
          ./scripts/config --enable CONFIG_PACKAGE_kmod-zram
          
          ./scripts/config --enable CONFIG_PACKAGE_alsa-utils
          ./scripts/config --enable CONFIG_PACKAGE_alsa-ucm-conf
          ./scripts/config --enable CONFIG_PACKAGE_bluez-daemon
          ./scripts/config --enable CONFIG_PACKAGE_bluez-utils
          ./scripts/config --enable CONFIG_PACKAGE_bluealsa
          
          ./scripts/config --enable CONFIG_PACKAGE_luci
          ./scripts/config --enable CONFIG_PACKAGE_luci-ssl
          ./scripts/config --enable CONFIG_PACKAGE_luci-theme-argon
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-ttyd
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-filemanager
          
          ./scripts/config --enable CONFIG_PACKAGE_travelmate
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-travelmate
          ./scripts/config --enable CONFIG_PACKAGE_relayd
          ./scripts/config --enable CONFIG_PACKAGE_luci-proto-relay
          ./scripts/config --enable CONFIG_PACKAGE_mwan3
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-mwan3
          
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-rndis
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-cdc-ether
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-serial
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-serial-option
          ./scripts/config --enable CONFIG_PACKAGE_usb-modeswitch
          
          ./scripts/config --enable CONFIG_PACKAGE_block-mount
          ./scripts/config --enable CONFIG_PACKAGE_kmod-fs-ext4
          ./scripts/config --enable CONFIG_PACKAGE_e2fsprogs
          ./scripts/config --enable CONFIG_PACKAGE_fdisk
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-diskman
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-samba4
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-aria2
          
          ./scripts/config --enable CONFIG_PACKAGE_vnstat
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-vnstat
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-nlbwmon
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-adblock
          ./scripts/config --enable CONFIG_PACKAGE_https-dns-proxy
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-https-dns-proxy
          ./scripts/config --enable CONFIG_PACKAGE_sqm
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-sqm
          ./scripts/config --enable CONFIG_PACKAGE_tailscale
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-wireguard
          
          ./scripts/config --enable CONFIG_PACKAGE_nano
          ./scripts/config --enable CONFIG_PACKAGE_htop
          ./scripts/config --enable CONFIG_PACKAGE_curl
          ./scripts/config --enable CONFIG_PACKAGE_wget-ssl
          ./scripts/config --enable CONFIG_PACKAGE_bash

          make defconfig

          # Verifikasi target armvirt
          if ! grep -q 'CONFIG_TARGET_BOARD="armvirt"' .config && ! grep -q 'CONFIG_TARGET_armvirt_64=y' .config; then
            echo "ERROR: Target armvirt ter-reset!"
            exit 1
          fi

      - name: Download Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile OpenWrt
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/tar/clean || true
          make -j1 V=s tools/tar/compile FORCE_UNSAFE_CONFIGURE=1 || true
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Pack to Android boot.img
        run: |
          mkdir -p output
          
          FIND_KERNEL=$(find openwrt/bin/targets/armvirt/ -type f \( -name "Image" -o -name "zImage" -o -name "vmlinux" \) | head -n 1)
          FIND_INITRD=$(find openwrt/bin/targets/armvirt/ -type f \( -name "*rootfs*.cpio.gz" -o -name "*initramfs*.cpio.gz" -o -name "*rootfs*.img" \) | head -n 1)
          
          echo "Found Kernel: $FIND_KERNEL"
          echo "Found Initrd: $FIND_INITRD"
          
          if [ -z "$FIND_KERNEL" ] || [ -z "$FIND_INITRD" ]; then
            echo "ERROR: Kernel or Ramdisk not found!"
            find openwrt/bin/targets/ -type f
            exit 1
          fi

          mkbootimg \
            --kernel "$FIND_KERNEL" \
            --ramdisk "$FIND_INITRD" \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3" \
            --base 0x80000000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --output output/openwrt-vince-boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-boot
          path: output/openwrt-vince-boot.img
